name: Update Claire Hughes Johnson podcast feed

on:
  schedule:
    # Mondays at 13:17 UTC. Off the hour on purpose: scheduled runs that land
    # on :00 sit in GitHub's busiest queue and get delayed the most.
    # NOTE: GitHub only honours `schedule` on the repository's DEFAULT branch.
    # Until this file is on the default branch, the weekly run will not fire.
    - cron: "17 13 * * 1"
  workflow_dispatch:
  push:
    # Lets the feed rebuild on the working branch, where `schedule` is inert.
    # Deliberately does NOT list known_episodes.json or docs/feed.xml -- those
    # are what this job commits, and matching them would make it retrigger
    # itself forever.
    paths:
      - "podcast-feed/build_feed.py"
      - "podcast-feed/seeds.json"
      - ".github/workflows/chj-podcast-feed.yml"

permissions:
  contents: write

concurrency:
  group: chj-podcast-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed
        run: python podcast-feed/build_feed.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain podcast-feed/known_episodes.json docs/feed.xml)" ]; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podcast-feed/known_episodes.json docs/feed.xml
          git commit -m "Update Claire Hughes Johnson podcast feed"
          git push
